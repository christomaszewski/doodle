name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  ROS_DISTRO: lyrical

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # Build the runtime image (no push: `rig build` / tools/build_image.sh
  # publishes), then run the supervisor, radio-client and ROS suites inside it so
  # the INSTALLED entrypoints (and real rclpy) are what gets exercised.
  # ---------------------------------------------------------------------------
  build-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.runtime
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: doodle_radio:ci
          cache-from: type=gha,scope=doodle-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=doodle-${{ matrix.arch }}
          build-args: |
            ROS_DISTRO=${{ env.ROS_DISTRO }}
      - name: Test installed supervisor against the simulated radio
        run: |
          docker run --rm --init --network none \
            -e DOODLE_TEST_ENTRYPOINT_DIR=/usr/local/bin \
            -v "$PWD:/workspace:ro" -w /workspace/tests doodle_radio:ci \
            python3 -m unittest test_radio_api test_supervisor test_service test_health \
              test_health_ros -v

  # ---------------------------------------------------------------------------
  # rig launcher contract, executable (see rigging.yaml): `rig certify` renders
  # `doodle-up <config> config` under a poisoned fleet env and checks project
  # name, registry/tag agreement, ROS env passthrough, determinism, identity and
  # `status` output.
  # ---------------------------------------------------------------------------
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: christomaszewski/rig
          path: .rig
      - run: python3 -m pip install --user pyyaml
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap libseccomp2
      - name: rig certify (launcher contract)
        run: ./.rig/rig certify --require-build-check --repo . --config sensors/doodle.example.yaml

  # ---------------------------------------------------------------------------
  # rig build contract (see rigging.yaml build:): build_image.sh must forward
  # the rig build env into the docker argv. A stub `docker` records the argv.
  # ---------------------------------------------------------------------------
  build-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: christomaszewski/rig
          path: .rig
      - run: python3 -m pip install --user pyyaml
      - name: Portable builder and Rig scope selection
        run: |
          RIG_SOURCE="$PWD/.rig" python3 -m unittest discover -s tests -p 'test_build*.py' -v

  # ---------------------------------------------------------------------------
  # Everything without a radio or ROS: config validation, power levels, the
  # radio client (HTTP + TLS), the supervisor process, launcher contracts and a
  # real `docker compose config` render.
  # ---------------------------------------------------------------------------
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --user pyyaml
      - run: python3 -m unittest discover -s tests -v

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck launcher + build script + entrypoints
        run: shellcheck doodle-up tools/build_image.sh tools/rig-build.sh docker/entrypoints/*.sh
